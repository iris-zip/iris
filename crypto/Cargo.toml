[package]
name = "iris-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[dependencies]
wasm-bindgen = "0.2"
# pinned pre-release: no stable spake2 exists as of 2026-05-24; re-check before next dep bump
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# zeroize feature: DecapsulationKey wipes on drop (review F5)
ml-kem = { version = "0.2", features = ["zeroize"] }
# zeroize feature: default-features=false had silently dropped it, leaving
# StaticSecret/SharedSecret unwiped on drop (review F4)
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
