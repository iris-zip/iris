[package]
name = "iris-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "set-header"] }
tower_governor = "0.4"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
http = "1"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
