name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack (pinned, checksum-verified)
        run: |
          WP_VERSION=v0.14.0
          WP_SHA256=278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d
          WP_DIR=wasm-pack-${WP_VERSION}-x86_64-unknown-linux-musl
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WP_VERSION}/${WP_DIR}.tar.gz"
          echo "${WP_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 755 "/tmp/${WP_DIR}/wasm-pack" "${HOME}/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Server unit tests
        run: cargo test --manifest-path server/Cargo.toml

      - name: Crypto unit tests
        run: cargo test --manifest-path crypto/Cargo.toml

      - name: WASM crypto tests
        run: wasm-pack test --headless --firefox crypto

      - name: Build WASM bundle (client/pkg is untracked — browser tests need it)
        run: wasm-pack build --target web --out-dir ../client/pkg crypto

      # The wasm bundle built above proves the crypto crate compiles from this
      # tree. Its exact bytes vary with the build environment, so the published
      # wasm hash is stamped by the release build, not re-derived here. What CI
      # asserts is the invariant a visitor relies on: the SRI hashes served by
      # index.html and published in HASHES.md match the tracked sources.
      - name: SRI consistency (tracked sources vs published hashes)
        run: |
          appjs=$(openssl dgst -sha384 -binary client/app.js | base64 -w0)
          qrjs=$(openssl dgst -sha384 -binary client/qr.js | base64 -w0)
          grep -qF "integrity=\"sha384-$appjs\"" client/index.html
          grep -qF "integrity=\"sha384-$qrjs\"" client/index.html
          grep -qF "sha384-$appjs" HASHES.md
          grep -qF "sha384-$qrjs" HASHES.md
          echo "SRI consistency holds for app.js and qr.js"

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Server release build
        run: cargo build --locked --release --manifest-path server/Cargo.toml
