name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Server unit tests
        run: cargo test --manifest-path server/Cargo.toml

      - name: Crypto unit tests
        run: cargo test --manifest-path crypto/Cargo.toml

      - name: WASM crypto tests
        run: wasm-pack test --headless --firefox crypto

      - name: Install Playwright
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Build server for browser tests
        run: cargo build --manifest-path server/Cargo.toml

      - name: Browser integration tests
        working-directory: tests/browser
        run: npx playwright test
